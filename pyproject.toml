[project]
name = "api-sentinel"
version = "2.0.0"
description = "API monitoring & reliability platform built with FastAPI and PostgreSQL"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["postgres: tests that need a real PostgreSQL database (TEST_DATABASE_URL)"]
filterwarnings = [
    "ignore::DeprecationWarning:aiosqlite.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008"]  # FastAPI Depends() defaults

[tool.ruff.lint.per-file-ignores]
"app/services/email_templates.py" = ["E501"]  # inline-styled HTML email
